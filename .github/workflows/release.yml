name: Build & Release Multi-Platform Game

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-Platform Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Code Verification & Typecheck
        run: npm run lint

      - name: Build Web Application & PWA
        run: npm run build

      - name: Generate Cross-Platform Release Packages
        run: node scripts/build-releases.js

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "رزم‌نامه نسخه ۱.۰.۰ | Razmnameh Multi-Platform Release v1.0.0"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-dist/*.zip
            release-dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
