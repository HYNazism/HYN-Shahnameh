name: Automated SemVer & Multi-Platform Device Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'نوع تغییر نسخه (patch = ساب‌ورژن جزئی، minor = ساب‌ورژن ویژگی، major = نسخه اصلی)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish 6-Platform Executables
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout Source Code with Full History & Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          

      - name: Setup Python 3 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Code Verification & Typecheck
        run: npm run lint

      - name: Determine Semantic Version (Sub-version vs Major Version)
        id: semver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="v${VERSION}"
            BUMP="tagged"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.5")
            BASE_VER="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VER"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            INPUT_BUMP="${{ github.event.inputs.bump_type }}"
            COMMIT_MSG="${{ github.event.head_commit.message }}"

            if [[ "$INPUT_BUMP" == "major" ]] || echo "$COMMIT_MSG" | grep -iqE "BREAKING CHANGE|^major:|!:"; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              BUMP="major"
            elif [[ "$INPUT_BUMP" == "minor" ]] || echo "$COMMIT_MSG" | grep -iqE "^(feat|minor)(\(.+\))?:"; then
              MINOR=$((MINOR + 1))
              PATCH=0
              BUMP="minor"
            else
              PATCH=$((PATCH + 1))
              BUMP="patch"
            fi

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "bump=${BUMP}" >> $GITHUB_OUTPUT
          echo "Detected Release Target: ${TAG} (${BUMP})"

      - name: Build Web Application & Offline PWA
        run: npm run build

      - name: Generate 6-Platform Executable Packages & SHA-256 Checksums
        env:
          RELEASE_VERSION: ${{ steps.semver.outputs.version }}
        run: python3 scripts/build-releases.py

      - name: Publish Official GitHub Release for All Devices
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: "رزم‌نامه نسخه ${{ steps.semver.outputs.tag }} | Razmnameh All-Devices Release (${{ steps.semver.outputs.bump }})"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/*.zip
            release-dist/sha256sums.txt
            release-dist/release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
